[project]
name = "insightgpt-worker"
version = "0.1.0"
description = "InsightGPT worker — APScheduler orchestrator that runs the ELT/reindex pipelines and records runs"
requires-python = ">=3.12"
license = { text = "MIT" }

# Kept small. The worker itself only schedules, shells out, and tracks runs;
# ingestion + retrieval are imported lazily at job time (they live in sibling
# services and are installed into the same container image), so they are NOT
# declared as dependencies here.
dependencies = [
    "apscheduler>=3.10,<4",   # the scheduler loop (BlockingScheduler)
    "psycopg[binary]>=3.2",   # writes insight.pipeline_runs
    "pydantic>=2.7",          # typed run records + settings models
    "pydantic-settings>=2.3", # env-driven config (DSN, URLs, schedules)
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.8"]

[project.scripts]
# `insight-worker` == `python -m worker`
insight-worker = "worker.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
