[project]
name = "insightgpt-mcp"
version = "0.1.0"
description = "InsightGPT MCP server — the governed semantic layer over the Model Context Protocol"
requires-python = ">=3.12"
license = { text = "MIT" }

# Kept deliberately small. Each dependency is a thing that can break.
dependencies = [
    "mcp>=1.2",             # official MCP SDK: FastMCP server + stdio transport
    "pydantic>=2.7",        # typed tool inputs/outputs (structured content)
    "insightgpt-api",       # the engine, catalog, builder and guardrails — path dep
]

[tool.uv.sources]
# The MCP server is a *thin adapter*. Every governed decision (catalog, query
# builder, guardrails, engine) lives in the API package and is imported, never
# reimplemented — so the two surfaces cannot drift apart.
insightgpt-api = { path = "../api" }

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.8"]

[project.scripts]
# Also runnable as `python -m insight_mcp`.
insight-mcp = "insight_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["insight_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
