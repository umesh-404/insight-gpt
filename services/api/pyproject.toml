[project]
name = "insightgpt-api"
version = "0.1.0"
description = "InsightGPT API and insight engine — grounded text-to-SQL + RAG synthesis"
requires-python = ">=3.12"
license = { text = "MIT" }

# Kept deliberately small. Each dependency is a thing that can break.
dependencies = [
    "pydantic>=2.7",            # typed models: answer envelope, selections, config
    "pydantic-settings>=2.3",   # env + config loading
    "pyyaml>=6.0",              # reads the semantic-layer catalog + config/*.yaml
    "sqlglot>=25.0",            # parses generated SQL for the guardrails (not regex)
    "httpx>=0.27",              # LLM provider HTTP (Ollama + cloud)
    "duckdb>=1.0",              # fixture warehouse so the engine runs with no external DB
]

[project.optional-dependencies]
# Real API surface (FastAPI) lands in the API phase; the engine works without it.
api = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pyjwt>=2.9",               # JWT access/refresh tokens (no crypto extras needed)
    "python-multipart>=0.0.9",  # form parsing for FastAPI request bodies
    "pypdf>=5.0",               # parse uploaded PDFs for text extraction
    "psycopg[binary]>=3.2",     # real Postgres executor (production warehouse)
    "fpdf2>=2.7,<3",            # server-side PDF export for /reports (pure Python)
]
# Real retrieval backend (Qdrant). Optional so the offline default never needs
# it: installed into the container image, imported lazily by engine/build.py.
real = [
    "insightgpt-retrieval",     # path/workspace dep — see [tool.uv.sources]
]
# Statistical forecasting backend (AutoETS/ARIMA/Theta). Optional on purpose:
# it pulls numpy + pandas + numba, which is a heavy, compiler-adjacent chain for
# an offline-first default. app/forecast/ detects it at runtime and otherwise
# runs a stdlib-only damped-Holt fallback, so CI never needs this installed.
# See docs/13-forecasting.md §5.
forecast = [
    "statsforecast>=1.7",
]

[tool.uv.sources]
insightgpt-retrieval = { path = "../retrieval" }

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency-injection idiom puts `Depends(...)` in argument defaults.
"app/api/**" = ["B008"]
"app/auth/**" = ["B008"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
