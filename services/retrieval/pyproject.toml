[project]
name = "insightgpt-retrieval"
version = "0.1.0"
description = "InsightGPT retrieval / RAG service — hybrid dense+sparse Qdrant search, RRF fusion, cross-encoder rerank"
requires-python = ">=3.12"
license = { text = "MIT" }

# Kept deliberately small. Each dependency is a thing that can break.
dependencies = [
    "pydantic>=2.7",        # typed config + the engine-facing RetrievedDoc model
    "pyyaml>=6.0",          # reads config/retrieval.yaml
    "httpx>=0.27",          # Ollama HTTP (embeddings + reranker)
    "qdrant-client>=1.12",  # vector store: dense + sparse, server-side RRF fusion
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.8"]

[project.scripts]
# Indexer + query CLI. Also runnable as `python -m retrieval.cli`.
insight-retrieval = "retrieval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["retrieval"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
