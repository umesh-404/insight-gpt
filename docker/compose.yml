# InsightGPT — full-stack Docker Compose topology (docs/09-deployment.md §1).
#
# Six services on a private network. Only `web` and `api` publish ports to the
# host; postgres/qdrant/ollama/worker are internal-only.
#
# HOW TO BRING THIS UP
# --------------------
# Use one of these, both from the REPO ROOT:
#
#   make up                                   # recommended
#   docker compose up --build                 # via the root compose.yaml
#
# Do NOT run `docker compose -f docker/compose.yml up` directly. Compose takes
# its PROJECT DIRECTORY from the first -f file, so that form looks for a .env in
# docker/, never finds the root one, and every ${VAR:-default} below silently
# falls back to its default — you would get LLM_PROVIDER=ollama no matter what
# your .env says. The root compose.yaml exists precisely so the plain command
# works; the Makefile passes `--env-file .env` explicitly for the same reason.
#
# First run then needs a one-time bootstrap:
#
#   make bootstrap
#
# Every value is interpolated from the root .env with a safe in-file default, so
# the stack also comes up on a bare checkout with no .env present.
#
# WHICH ENDPOINTS BELONG TO WHICH TOPOLOGY
# ----------------------------------------
# Inside this network the stores answer to their SERVICE NAMES:
#
#   qdrant   ->  http://qdrant:6333
#   ollama   ->  http://ollama:11434
#   postgres ->  postgres:5432       (and WAREHOUSE=postgres)
#
# Those names are correct HERE and wrong anywhere else: a host-run API resolves
# none of them, and the root `.env` is therefore written for the host run
# (127.0.0.1 and WAREHOUSE=duckdb — see .env.example). To let one .env serve
# both, the three variables that differ by topology are NOT interpolated from
# the host-run names below. They read `STACK_`-prefixed overrides instead and
# otherwise keep the service-name default:
#
#   STACK_QDRANT_URL    -> QDRANT_URL   (default http://qdrant:6333)
#   STACK_OLLAMA_HOST   -> OLLAMA_HOST  (default http://ollama:11434)
#   STACK_WAREHOUSE     -> WAREHOUSE    (default postgres)
#
# So: set QDRANT_URL in .env to move the HOST run; set STACK_QDRANT_URL to move
# the CONTAINERISED run (at a managed Qdrant, say). Every other variable means
# the same thing in both and is interpolated normally. docs/09-deployment.md §2.0.

name: insightgpt

services:
  # --- Warehouse ------------------------------------------------------------
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-insight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-insight}
      POSTGRES_DB: ${POSTGRES_DB:-insight}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once on an empty volume: creates raw/marts/insight + pipeline_runs.
      - ./initdb:/docker-entrypoint-initdb.d:ro
    # Loopback-only publish keeps Postgres reachable for host-side dbt/psql
    # while never exposing it beyond the machine.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-insight} -d ${POSTGRES_DB:-insight}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # --- Vector DB ------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    volumes:
      - qdrant_storage:/qdrant/storage
    # Internal only. Uncomment to expose REST/gRPC on loopback for debugging.
    # ports:
    #   - "127.0.0.1:6333:6333"
    #   - "127.0.0.1:6334:6334"
    # No container healthcheck: the qdrant image is distroless (no curl/shell),
    # so a CMD-SHELL probe can never pass. Dependents use `service_started` and
    # rely on their own connection-retry logic (and bootstrap's readiness wait).

  # --- Local models (embeddings, rerank, default LLM) -----------------------
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      # `ollama list` hits the same daemon as GET /api/tags and is always in the
      # image, so it is a reliable readiness probe.
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # --- API (REST + SSE, insight engine, auth) -------------------------------
  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      ollama:
        condition: service_healthy
    environment:
      # APP_ENV=production makes the container refuse to start on a config
      # that cannot serve users: the template provider, or a cloud provider
      # with no key. Leave it unset for offline development.
      APP_ENV: ${APP_ENV:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_MODEL: ${LLM_MODEL:-llama3.1:8b}
      # Service name, not the host-run loopback in .env — see the header.
      OLLAMA_HOST: ${STACK_OLLAMA_HOST:-http://ollama:11434}
      # Cloud keys for the OpenAI-compatible providers. Blank unless
      # LLM_PROVIDER names one; without the matching key the API now fails at
      # STARTUP naming the variable, rather than at a user's first question.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      # Cost and latency ceilings for one reasoning call.
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-2048}
      LLM_TIMEOUT_S: ${LLM_TIMEOUT_S:-60}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-3}
      # This stack always has a Postgres sibling, so it does not inherit the
      # host run's duckdb fixture setting — see the header.
      WAREHOUSE: ${STACK_WAREHOUSE:-postgres}
      # The API queries as the SELECT-only role (created in initdb), so a
      # failure of the SQL guardrails still cannot mutate the warehouse.
      # The worker below keeps the owner DSN because dbt must create tables.
      POSTGRES_DSN: ${APP_POSTGRES_DSN:-postgresql://insight_app:insight@postgres:5432/insight}
      RETRIEVER: ${RETRIEVER:-qdrant}
      # Service name, not the host-run loopback in .env — see the header.
      QDRANT_URL: ${STACK_QDRANT_URL:-http://qdrant:6333}
      # The ONE collection InsightGPT owns. Shared between topologies on
      # purpose: the name is the same wherever the instance lives, and the
      # indexer, the API and the dataset router must all read it from here
      # rather than repeat a literal. Nothing in this repo drops, resets or
      # prunes a collection whose name does not start with `insightgpt_`.
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-insightgpt_documents}
      EMBED_MODEL: ${EMBED_MODEL:-nomic-embed-text}
      # Embedding backend. The compose stack runs an Ollama sibling, so the
      # default needs nothing. EMBED_PROVIDER=openai switches to a cloud
      # /embeddings endpoint for hosts that have no model server to point at.
      EMBED_PROVIDER: ${EMBED_PROVIDER:-ollama}
      EMBED_API_KEY_ENV: ${EMBED_API_KEY_ENV:-GEMINI_API_KEY}
      EMBED_BASE_URL: ${EMBED_BASE_URL:-}
      # Must match the collection's vector width; a mismatch is refused, not
      # written, so changing this means a re-index.
      EMBED_DIMENSIONS: ${EMBED_DIMENSIONS:-}
      # The API reranks at query time through the shared retrieval package, so it
      # needs the SAME rerank model bootstrap pulled in the worker. Omitting it
      # here let the API fall back to the config-file default while .env named a
      # different model — the mismatch surfaces only as silently missing rerank.
      RERANK_MODEL: ${RERANK_MODEL:-dengcao/Qwen3-Reranker-0.6B:F16}
      # No default: a placeholder here is a signing key an attacker can guess,
      # and the API now refuses to start on one anyway, so compose should fail
      # at `up` with a readable message instead of after the container boots.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (openssl rand -hex 32)}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:3020,http://127.0.0.1:3020}
      TODAY: ${TODAY:-2026-07-15}
      # /sources reports on the generator's CSV extracts and the redacted
      # document corpus, so the API needs the SAME two locations the worker
      # writes. Without them the source registry rendered every file-backed
      # source as missing while the worker held the data.
      GENERATED_DIR: ${GENERATED_DIR:-/app/data/generated}
      DOCUMENT_CORPUS_PATH: ${DOCUMENT_CORPUS_PATH:-/app/data/ingested/documents.json}
    volumes:
      # Read-only: the API only inspects and retrieves from these: ingestion
      # and dbt run in the worker, which mounts the same volumes writable.
      - generated_data:/app/data/generated:ro
      - ingested_data:/app/data/ingested:ro
    healthcheck:
      # The API serves GET /health at the root. python (urllib) is always in the
      # image, so this is a reliable probe and lets `web` gate on api readiness.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=4).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    ports:
      - "${API_PORT:-8000}:8000"

  # --- Worker (APScheduler jobs, pipeline runs, dbt) ------------------------
  worker:
    build:
      context: ..
      dockerfile: docker/worker.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      ollama:
        condition: service_healthy
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_MODEL: ${LLM_MODEL:-llama3.1:8b}
      # Service names, not the host-run values in .env — see the header.
      OLLAMA_HOST: ${STACK_OLLAMA_HOST:-http://ollama:11434}
      WAREHOUSE: ${STACK_WAREHOUSE:-postgres}
      POSTGRES_DSN: ${POSTGRES_DSN:-postgresql://insight:insight@postgres:5432/insight}
      # dbt / seed.py read the discrete POSTGRES_* vars (profiles.yml, seed guard).
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-insight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-insight}
      POSTGRES_DB: ${POSTGRES_DB:-insight}
      RETRIEVER: ${RETRIEVER:-qdrant}
      QDRANT_URL: ${STACK_QDRANT_URL:-http://qdrant:6333}
      # Same single collection as the api service; never a literal in two places.
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-insightgpt_documents}
      EMBED_MODEL: ${EMBED_MODEL:-nomic-embed-text}
      # Embedding backend. The compose stack runs an Ollama sibling, so the
      # default needs nothing. EMBED_PROVIDER=openai switches to a cloud
      # /embeddings endpoint for hosts that have no model server to point at.
      EMBED_PROVIDER: ${EMBED_PROVIDER:-ollama}
      EMBED_API_KEY_ENV: ${EMBED_API_KEY_ENV:-GEMINI_API_KEY}
      EMBED_BASE_URL: ${EMBED_BASE_URL:-}
      # Must match the collection's vector width; a mismatch is refused, not
      # written, so changing this means a re-index.
      EMBED_DIMENSIONS: ${EMBED_DIMENSIONS:-}
      RERANK_MODEL: ${RERANK_MODEL:-dengcao/Qwen3-Reranker-0.6B:F16}
      # reindex_docs reads the corpus services/ingestion publishes. "samples"
      # switches it to the built-in demo set (explicit fallback only).
      REINDEX_SOURCE: ${REINDEX_SOURCE:-ingested}
      # One variable relocates all three sides of the hand-off: ingestion writes
      # here, the reindex job reads here, the retrieval CLI defaults to here.
      DOCUMENT_CORPUS_PATH: ${DOCUMENT_CORPUS_PATH:-/app/data/ingested/documents.json}
      INSIGHT_REFERENCE_DATE: ${TODAY:-2026-07-15}
      TODAY: ${TODAY:-2026-07-15}
    volumes:
      # The generator's output and the published document corpus must OUTLIVE the
      # container that produced them: `make bootstrap` / `make seed` run in a
      # throwaway `compose run --rm worker`, while the scheduler that reindexes
      # from the corpus is the long-running worker service. Without these volumes
      # the scheduled reindex_docs would never find a corpus to index.
      # Mounted at the two OUTPUT directories, not at /app/data, so the baked-in
      # `data/generator` package stays visible.
      - generated_data:/app/data/generated
      - ingested_data:/app/data/ingested
    healthcheck:
      # The worker serves GET /health on 8090 (internal only).
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8090/health', timeout=4).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # --- Frontend (Next.js) ---------------------------------------------------
  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
      args:
        # NEXT_PUBLIC_* are baked at build time, so pass them as build args too.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
        NEXT_PUBLIC_USE_MOCK: ${NEXT_PUBLIC_USE_MOCK:-false}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
      NEXT_PUBLIC_USE_MOCK: ${NEXT_PUBLIC_USE_MOCK:-false}
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  pgdata:
  qdrant_storage:
  ollama_models:
  generated_data:   # synthetic CSVs + document JSON written by scripts/seed.py
  ingested_data:    # the redacted document corpus handed to retrieval
